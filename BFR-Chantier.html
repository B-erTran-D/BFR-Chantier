        const stream = ops;
        const resImg = info.images.length
          ? '/XObject << ' + info.images.map(im => `/${im.name} ${im.num} 0 R`).join(' ') + ' >>'
          : '';
        put(info.page,
          `<< /Type /Page /Parent ${pagesNum} 0 R /MediaBox [0 0 ${f(this.W)} ${f(this.H)}] ` +
          `/Resources << /Font << /F1 ${F1} 0 R /F2 ${F2} 0 R /F3 ${F3} 0 R /F4 ${F4} 0 R >> ${resImg} >> ` +
          `/Contents ${info.content} 0 R >>`);
        const sb = toAsciiBytes(stream);
        put(info.content, { stream: sb });
        info.images.forEach(im => {
          const imgDigits = jpegDims(im.bytes);
          put(im.num, {
            stream: im.bytes,
            dict: `<< /Type /XObject /Subtype /Image /Width ${imgDigits.w} /Height ${imgDigits.h} ` +
                  `/ColorSpace /DeviceRGB /BitsPerComponent 8 /Filter /DCTDecode /Length ${im.bytes.length} >>`
          });
        });
      });

      objs.sort((a, b) => a.num - b.num);

      /* Assemblage du fichier */
      const chunks = [];
      let offset = 0;
      const push = (u8) => { chunks.push(u8); offset += u8.length; };
      const pushStr = (s) => push(toAsciiBytes(s));

      pushStr('%PDF-1.4\n%\xE2\xE3\xCF\xD3\n');
      const offsets = {};
      objs.forEach(o => {
        offsets[o.num] = offset;
        if (typeof o.body === 'string') {
          pushStr(`${o.num} 0 obj\n${o.body}\nendobj\n`);
        } else if (o.body.dict) {
          pushStr(`${o.num} 0 obj\n${o.body.dict}\nstream\n`);
          push(o.body.stream);
          pushStr('\nendstream\nendobj\n');
        } else {
          const len = o.body.stream.length;
          pushStr(`${o.num} 0 obj\n<< /Length ${len} >>\nstream\n`);
          push(o.body.stream);
          pushStr('\nendstream\nendobj\n');
        }
      });

      const maxNum = objs.length ? objs[objs.length - 1].num : 0;
      const xrefOffset = offset;
      let xref = `xref\n0 ${maxNum + 1}\n0000000000 65535 f \n`;
      for (let i = 1; i <= maxNum; i++) {
        xref += ('0000000000' + (offsets[i] || 0)).slice(-10) + ' 00000 n \n';
      }
      pushStr(xref);
      pushStr(`trailer\n<< /Size ${maxNum + 1} /Root ${catalogNum} 0 R >>\nstartxref\n${xrefOffset}\n%%EOF\n`);

      const total = chunks.reduce((a, c) => a + c.length, 0);
      const out = new Uint8Array(total);
      let p = 0;
      chunks.forEach(c => { out.set(c, p); p += c.length; });
      return out;
    }

    blob() { return new Blob([this.build()], { type: 'application/pdf' }); }
  }

  /* ======================================================================
     Aperçu à l'écran — même mise en page, dessinée sur des canvas
     ----------------------------------------------------------------------
     Chrome (et les visionneuses mobiles) refusent d'afficher un PDF dans un
     cadre : on rejoue donc la mise en page sur des canvas. Le rapport est
     ainsi visible dans l'application elle-même, sans visionneuse PDF.
     ====================================================================== */
  class PdfApercu {
    constructor(opts) {
      opts = opts || {};
      this.W = opts.width || 595.28;
      this.H = opts.height || 841.89;
      this.margin = opts.margin != null ? opts.margin : 34;
      this.langue = opts.langue || 'fr';        // comme le PDF : mêmes libellés
      this.pages = [];
      this.newPage();
    }
    newPage() {
      this.page = { ops: [] };
      this.pages.push(this.page);
      this.y = this.margin;
      return this.page;
    }
    get contentWidth() { return this.W - 2 * this.margin; }
    ensure(height) {
      if (this.y + height > this.H - this.margin) { this.newPage(); return true; }
      return false;
    }
    rect(x, y, w, h, opt) {
      opt = opt || {};
      this.page.ops.push({ t: 'rect', x: x, y: y, w: w, h: h, fill: opt.fill, stroke: opt.stroke, lw: opt.lineWidth || 0.7 });
    }
    line(x1, y1, x2, y2, opt) {
      opt = opt || {};
      this.page.ops.push({ t: 'line', x1: x1, y1: y1, x2: x2, y2: y2, color: opt.color || [0.7, 0.7, 0.7], lw: opt.width || 0.7 });
    }
    text(str, x, y, opt) {
      opt = opt || {};
      str = traduire(str, this.langue);
      const size = opt.size || 9;
      const texte = String(str == null ? '' : str);
      const largeur = measure(texte, size, opt.bold);       // largeur de référence (Helvetica)
      let px = x;
      if (opt.align === 'right') px = x - largeur;
      else if (opt.align === 'center') px = x - largeur / 2;
      this.page.ops.push({ t: 'text', s: texte, x: px, y: y, size: size, w: largeur,
        font: opt.font || 'F1', color: opt.color || [0.1, 0.1, 0.12] });
      return size * 1.15;
    }
    paragraph(str, x, y, width, opt) {
      opt = opt || {};
      str = traduire(str, this.langue);
      const size = opt.size || 9;
      const lh = opt.lineHeight || size * 1.35;
      const lignes = wrap(str, width, size, opt.bold);
      lignes.forEach((l, i) => this.text(l, x, y + i * lh + size, { size: size, font: opt.font, color: opt.color, bold: opt.bold }));
      return y + lignes.length * lh;
    }
    paragraphHeight(str, width, size, bold) {
      size = size || 9;
      str = traduire(str, this.langue);
      return Math.max(1, wrap(str, width, size, bold).length) * (size * 1.35);
    }
    /* Les images arrivent ici en octets JPEG (comme dans le PDF) : on les garde
       en mémoire, elles seront dessinées après chargement par rendrePages(). */
    image(bytes, x, y, w, h) {
      this.page.ops.push({ t: 'img', bytes: bytes, x: x, y: y, w: w, h: h });
    }
    addFooters(fn) {
      const total = this.pages.length;
      this.pages.forEach((p, i) => {
        const saved = this.page;
        this.page = p;
        fn(this, i + 1, total);
        this.page = saved;
      });
    }
    /** Nombre de pages (utile pour l'affichage). */
    get nbPages() { return this.pages.length; }
  }

  function octetsVersDataUrl(bytes) {
    let bin = '';
    const pas = 8192;
    for (let i = 0; i < bytes.length; i += pas) {
      bin += String.fromCharCode.apply(null, bytes.subarray ? bytes.subarray(i, i + pas) : bytes.slice(i, i + pas));
    }
    return 'data:image/jpeg;base64,' + btoa(bin);
  }

  const COULEUR_CSS = (c) => 'rgb(' + Math.round(c[0] * 255) + ',' + Math.round(c[1] * 255) + ',' + Math.round(c[2] * 255) + ')';
  const POLICE_CSS = (font, size, echelle) => {
    const gras = font === 'F2' || font === 'F4';
    const italique = font === 'F3' || font === 'F4';
    const family = gras
      ? '"Poppins", "Open Sans", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif'
      : '"Open Sans", "Poppins", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif';
    return (italique ? 'italic ' : '') + (gras ? '700 ' : '400 ') + (size * echelle) + 'px ' + family;
  };

  /** Dessine un document d'aperçu sur des canvas (un par page).
      Les images (logo, photos, signatures) sont chargées d'abord, puis posées :
      chaque opération d'image reçoit sa référence chargée (o.img). */
  function rendrePages(doc, opts) {
    opts = opts || {};
    const echelle = opts.echelle || 1.4;
    const aCharger = [];
    doc.pages.forEach(function (page) {
      page.ops.forEach(function (o) {
        if (o.t === 'img' && !o.img && !o.erreur) aCharger.push(o);
      });
    });

    function charger(op) {
      return new Promise(function (resolve) {
        const img = new Image();
        img.onload = function () { op.img = img; resolve(); };
        img.onerror = function () { op.erreur = true; resolve(); };
        img.src = octetsVersDataUrl(op.bytes);
      });
    }

    return Promise.all(aCharger.map(charger)).then(function () {
      return doc.pages.map(function (page, indice) {
        const c = document.createElement('canvas');
        c.width = Math.round(doc.W * echelle);
        c.height = Math.round(doc.H * echelle);
        c.className = 'apercu-page';
        c.setAttribute('data-page', String(indice + 1));
        const ctx = c.getContext('2d');
        ctx.textBaseline = 'alphabetic';
        ctx.fillStyle = '#ffffff';
        ctx.fillRect(0, 0, c.width, c.height);
        const E = echelle;
        page.ops.forEach(function (o) {
          if (o.t === 'rect') {
            if (o.fill) { ctx.fillStyle = COULEUR_CSS(o.fill); ctx.fillRect(o.x * E, o.y * E, o.w * E, o.h * E); }
            if (o.stroke) {
              ctx.strokeStyle = COULEUR_CSS(o.stroke);
              ctx.lineWidth = Math.max(0.5, o.lw * E);
              ctx.strokeRect(o.x * E, o.y * E, o.w * E, o.h * E);
            }
          } else if (o.t === 'line') {
            ctx.strokeStyle = COULEUR_CSS(o.color);
            ctx.lineWidth = Math.max(0.5, o.lw * E);
            ctx.beginPath();
            ctx.moveTo(o.x1 * E, o.y1 * E);
            ctx.lineTo(o.x2 * E, o.y2 * E);
            ctx.stroke();
          } else if (o.t === 'text') {
            ctx.fillStyle = COULEUR_CSS(o.color);
            ctx.font = POLICE_CSS(o.font, o.size, E);
            /* La police de l'écran n'a pas forcément les mêmes largeurs que
               l'Helvetica du PDF : on comprime légèrement un texte trop long
               pour qu'il ne soit jamais coupé à l'affichage. */
            const dispo = (doc.W - (doc.margin || 34)) * E - o.x * E - 3;
            const largeur = ctx.measureText ? ctx.measureText(o.s).width : 0;
            let facteur = 1;
            if (largeur > 0 && o.w) {
              /* La police de l'écran (Roboto, DejaVu…) n'a pas les largeurs de
                 l'Helvetica du PDF : on cale chaque texte sur la largeur prévue,
                 bornée pour rester dans la marge. Ainsi, l'écran montre
                 exactement la même mise en page que le fichier PDF. */
              facteur = Math.min(o.w * E / largeur, dispo / largeur);
              facteur = Math.max(0.55, Math.min(facteur, 1.15));
            }
            if (Math.abs(facteur - 1) > 0.01) {
              ctx.save();
              ctx.translate(o.x * E, o.y * E);
              ctx.scale(facteur, facteur);
              ctx.fillText(o.s, 0, 0);
              ctx.restore();
            } else {
              ctx.fillText(o.s, o.x * E, o.y * E);
            }
          } else if (o.t === 'img' && o.img) {
            ctx.drawImage(o.img, o.x * E, o.y * E, o.w * E, o.h * E);
          }
        });
        return c;
      });
    });
  }

  function f(num) {
    const v = Math.round(num * 100) / 100;
    return String(v);
  }

  function toAsciiBytes(s) {
    const a = new Uint8Array(s.length);
    for (let i = 0; i < s.length; i++) a[i] = s.charCodeAt(i) & 0xFF;
    return a;
  }

  /** Lit les dimensions réelles d'un JPEG (marqueur SOF). */
  function jpegDims(b) {
    let i = 2;
    while (i < b.length) {
      if (b[i] !== 0xFF) { i++; continue; }
      const marker = b[i + 1];
      if (marker >= 0xC0 && marker <= 0xCF && marker !== 0xC4 && marker !== 0xC8 && marker !== 0xCC) {
        return { h: (b[i + 5] << 8) | b[i + 6], w: (b[i + 7] << 8) | b[i + 8] };
      }
      const len = (b[i + 2] << 8) | b[i + 3];
      i += 2 + len;
    }
    return { w: 1000, h: 1000 }; // secours
  }

  global.Pdf = {
    Doc: PdfDoc,
    Apercu: PdfApercu,
    rendrePages: rendrePages,
    octetsVersDataUrl: octetsVersDataUrl,
    measure: measure,
    trunc: trunc,
    wrap: wrap,
    dataUrlToBytes: dataUrlToBytes,
    jpegDims: jpegDims
  };
})(typeof window !== 'undefined' ? window : this);

</script>

<script>
/* ===== annotate.js ===== */
/* =========================================================================
   annotate.js — Annotation d'une photo au doigt (flèche, cercle, texte, tracé)
   Les annotations sont mémorisées en coordonnées relatives (0 → 1) :
   elles se redessinent à n'importe quelle résolution à l'export.
   ========================================================================= */
(function (global) {
  'use strict';

  /* palette de charte : rouge de signalement, cyan BFR, vert d'état, blanc, encre */
  const COULEURS = ['#b42318', '#06baf2', '#1c8676', '#ffffff', '#1f1c45'];
  const OUTILS = {
    crayon: {
      nom: 'Crayon',
      ico: '<svg class="bfr-ico" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"/></svg>'
    },
    fleche: {
      nom: 'Flèche',
      ico: '<svg class="bfr-ico" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="5" y1="12" x2="19" y2="12"/><polyline points="12 5 19 12 12 19"/></svg>'
    },
    cercle: {
      nom: 'Cercle',
      ico: '<svg class="bfr-ico" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/></svg>'
    },
    texte: {
      nom: 'Texte',
      ico: '<svg class="bfr-ico" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="4 7 4 4 20 4 20 7"/><line x1="12" y1="4" x2="12" y2="20"/><line x1="9" y1="20" x2="15" y2="20"/></svg>'
    }
  };

  /** Convertit une image (dataURL) en objet Image chargé. */
  function chargerImage(dataUrl) {
    return new Promise(function (resolve, reject) {
      const img = new Image();
      img.onload = function () { resolve(img); };
      img.onerror = reject;
      img.src = dataUrl;
    });
  }

  /** Dessine une annotation sur un contexte, dans un rectangle cible. */
  function dessinerAnnotation(ctx, a, rect) {
    const X = (v) => rect.x + v * rect.w;
    const Y = (v) => rect.y + v * rect.h;
    const ep = Math.max(2, rect.w * 0.006);        // épaisseur proportionnelle
    ctx.save();
    ctx.strokeStyle = a.couleur;
    ctx.fillStyle = a.couleur;
    ctx.lineWidth = ep;
    ctx.lineCap = 'round';
    ctx.lineJoin = 'round';

    if (a.type === 'crayon') {
      ctx.beginPath();
      a.points.forEach(function (p, i) {
        if (i === 0) ctx.moveTo(X(p[0]), Y(p[1])); else ctx.lineTo(X(p[0]), Y(p[1]));
      });
      ctx.stroke();
    } else if (a.type === 'fleche') {
      const x1 = X(a.points[0][0]), y1 = Y(a.points[0][1]);
      const x2 = X(a.points[1][0]), y2 = Y(a.points[1][1]);
      ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2); ctx.stroke();
      const ang = Math.atan2(y2 - y1, x2 - x1);
      const t = ep * 4.2;
      ctx.beginPath();
      ctx.moveTo(x2, y2);
      ctx.lineTo(x2 - t * Math.cos(ang - 0.4), y2 - t * Math.sin(ang - 0.4));
      ctx.lineTo(x2 - t * Math.cos(ang + 0.4), y2 - t * Math.sin(ang + 0.4));
      ctx.closePath(); ctx.fill();
    } else if (a.type === 'cercle') {
      const cx = X(a.points[0][0]), cy = Y(a.points[0][1]);
      const rx = Math.abs(X(a.points[1][0]) - cx), ry = Math.abs(Y(a.points[1][1]) - cy);
      ctx.beginPath();
      ctx.ellipse(cx, cy, Math.max(2, rx), Math.max(2, ry), 0, 0, Math.PI * 2);
      ctx.stroke();
    } else if (a.type === 'texte') {
      const taille = Math.max(12, rect.w * (a.taille || 0.045));
      ctx.font = '600 ' + taille + 'px system-ui, sans-serif';
      ctx.textBaseline = 'top';
      ctx.lineWidth = Math.max(2, taille * 0.18);
      ctx.strokeStyle = 'rgba(0,0,0,.75)';
      ctx.strokeText(a.texte, X(a.points[0][0]), Y(a.points[0][1]));
      ctx.fillStyle = a.couleur;
      ctx.fillText(a.texte, X(a.points[0][0]), Y(a.points[0][1]));
    }
    ctx.restore();
  }

  /** Calcule le rectangle « contain » de l'image dans un canvas. */
  function rectContain(iw, ih, cw, ch) {
    const ratio = Math.min(cw / iw, ch / ih);
    const w = iw * ratio, h = ih * ratio;
    return { x: (cw - w) / 2, y: (ch - h) / 2, w: w, h: h };
  }

  /* ===================================================================== */
  class Editeur {
    constructor(photo, callbacks) {
      /* photo : { dataUrl, annotations } */
      this.photo = photo;
      this.cb = callbacks || {};
      this.annotations = (photo.annotations || []).map(a => JSON.parse(JSON.stringify(a)));
      this.outil = null;
      this.couleur = '#e11d48';
      this.enCours = null;
      this.ouvrir();
    }

    ouvrir() {
      const overlay = document.createElement('div');
      overlay.className = 'annot-editeur';
      overlay.innerHTML = `
        <div class="annot-bar">
          <button type="button" class="iconbtn" data-a="annuler">${(window.ICO && window.ICO.close(20)) || '✕'}</button>
          <div class="annot-titre">Annoter la photo</div>
          <button type="button" class="btn sm" data-a="valider">Valider</button>
        </div>
        <div class="annot-zone"><canvas id="annotCanvas"></canvas>
          <p class="annot-vide">Choisissez un outil ci-dessous, puis annotez la photo au doigt.</p>
        </div>
        <div class="annot-outils">
          <div class="annot-ligne">
            ${Object.keys(OUTILS).map(o => `<button type="button" class="outil" data-outil="${o}"><span>${OUTILS[o].ico}</span>${OUTILS[o].nom}</button>`).join('')}
          </div>
          <div class="annot-ligne">
            ${COULEURS.map(c => `<button type="button" class="pastille" data-couleur="${c}" style="background:${c}"></button>`).join('')}
            <button type="button" class="btn sm grey" data-a="undo">Annuler</button>
            <button type="button" class="btn sm grey" data-a="vider">${(window.ICO && window.ICO.trash(14)) || ''} Tout</button>
          </div>
        </div>`;
      document.body.appendChild(overlay);
      this.overlay = overlay;
      this.canvas = overlay.querySelector('#annotCanvas');

      overlay.addEventListener('click', (e) => {
        const o = e.target.closest('[data-outil]');
        if (o) {
          this.outil = o.dataset.outil;
          overlay.querySelectorAll('.outil').forEach(b => b.classList.toggle('on', b === o));
          overlay.querySelector('.annot-vide').style.display = 'none';
          return;
        }
        const p = e.target.closest('[data-couleur]');
        if (p) {
          this.couleur = p.dataset.couleur;
          overlay.querySelectorAll('.pastille').forEach(b => b.classList.toggle('on', b === p));
          return;
        }
        const a = e.target.closest('[data-a]');
        if (!a) return;
        if (a.dataset.a === 'annuler') this.fermer(false);
        else if (a.dataset.a === 'valider') this.valider();
        else if (a.dataset.a === 'undo') { this.annotations.pop(); this.redessiner(); }
        else if (a.dataset.a === 'vider') { this.annotations = []; this.redessiner(); }
      });

      this.canvas.addEventListener('pointerdown', (e) => this.pointerDown(e));
      this.canvas.addEventListener('pointermove', (e) => this.pointerMove(e));
      this.canvas.addEventListener('pointerup', (e) => this.pointerUp(e));
      this.canvas.addEventListener('pointercancel', (e) => this.pointerUp(e));
      window.addEventListener('resize', () => this.redimensionner());

      this.pret = chargerImage(this.photo.dataUrl).then((img) => {
        this.img = img;
        this.redimensionner();
      }).catch(() => { this.fermer(false); });
    }

    redimensionner() {
      if (!this.img) return;
      const zone = this.overlay.querySelector('.annot-zone');
      const rect = zone.getBoundingClientRect();
      const dpr = Math.min(2.5, window.devicePixelRatio || 1);
      this.canvas.width = Math.max(280, Math.round(rect.width * dpr));
      this.canvas.height = Math.max(220, Math.round(rect.height * dpr));
      this.rectImage = rectContain(this.img.width, this.img.height, this.canvas.width, this.canvas.height);
      this.redessiner();
    }

    redessiner() {
      if (!this.img) return;
      const ctx = this.canvas.getContext('2d');
      ctx.clearRect(0, 0, this.canvas.width, this.canvas.height);
      ctx.fillStyle = '#0b1220';
      ctx.fillRect(0, 0, this.canvas.width, this.canvas.height);
      ctx.drawImage(this.img, this.rectImage.x, this.rectImage.y, this.rectImage.w, this.rectImage.h);
      this.annotations.forEach(a => dessinerAnnotation(ctx, a, this.rectImage));
      if (this.enCours) dessinerAnnotation(ctx, this.enCours, this.rectImage);
    }

    /** Position relative (0→1) dans l'image. */
    relatif(e) {
      const r = this.canvas.getBoundingClientRect();
      const cx = (e.clientX - r.left) * (this.canvas.width / (r.width || 1));
      const cy = (e.clientY - r.top) * (this.canvas.height / (r.height || 1));
      const im = this.rectImage;
      return [
        Math.min(1, Math.max(0, (cx - im.x) / im.w)),
        Math.min(1, Math.max(0, (cy - im.y) / im.h))
      ];
    }

    pointerDown(e) {
      if (!this.outil) { this.erreur('Choisissez d\'abord un outil (flèche, cercle, crayon ou texte)'); return; }
      if (!this.img) { this.erreur('Photo en cours de chargement'); return; }
      e.preventDefault();
      if (this.outil === 'texte') {
        const p = this.relatif(e);
        const texte = prompt('Texte à afficher sur la photo :');
        if (texte && texte.trim()) {
          this.annotations.push({ type: 'texte', couleur: this.couleur, points: [p], texte: texte.trim(), taille: 0.045 });
          this.redessiner();
        }
        return;
      }
      const p = this.relatif(e);
      this.enCours = { type: this.outil, couleur: this.couleur, points: [p] };
      if (this.outil === 'crayon') this.enCours.points = [p];
      try { this.canvas.setPointerCapture(e.pointerId); } catch (err) {}
    }

    pointerMove(e) {
      if (!this.enCours) return;
      e.preventDefault();
      const p = this.relatif(e);
      if (this.enCours.type === 'crayon') this.enCours.points.push(p);
      else this.enCours.points[1] = p;
      this.redessiner();
    }

    pointerUp(e) {
      if (!this.enCours) return;
      const a = this.enCours;
      this.enCours = null;
      const assez = a.type === 'crayon'
        ? a.points.length > 2
        : (a.points[1] && (Math.abs(a.points[1][0] - a.points[0][0]) > 0.008 || Math.abs(a.points[1][1] - a.points[0][1]) > 0.008));
      if (assez) this.annotations.push(a);
      this.redessiner();
    }

    /** Exporte l'image annotée (JPEG) à une résolution raisonnable. */
    async exporter(largeurMax) {
      largeurMax = largeurMax || 1600;
      const ratio = Math.min(1, largeurMax / this.img.width);
      const w = Math.round(this.img.width * ratio);
      const h = Math.round(this.img.height * ratio);
      const c = document.createElement('canvas');
      c.width = w; c.height = h;
      const ctx = c.getContext('2d');
      ctx.fillStyle = '#fff';
      ctx.fillRect(0, 0, w, h);
      ctx.drawImage(this.img, 0, 0, w, h);
      const rect = { x: 0, y: 0, w: w, h: h };
      this.annotations.forEach(a => dessinerAnnotation(ctx, a, rect));
      return c.toDataURL('image/jpeg', 0.85);
    }

    async valider() {
      if (!this.img) { this.erreur('Photo en cours de chargement — réessayez dans un instant'); return; }
      const dataUrl = await this.exporter();
      this.photo.dataUrl = dataUrl;
      this.photo.annotations = JSON.parse(JSON.stringify(this.annotations));
      this.fermer(true);
    }

    /** Message discret en bas de l'écran d'annotation. */
    erreur(message) {
      let el = this.overlay.querySelector('.annot-erreur');
      if (!el) {
        el = document.createElement('div');
        el.className = 'annot-erreur';
        this.overlay.appendChild(el);
      }
      el.textContent = message;
      clearTimeout(this._errTimer);
      this._errTimer = setTimeout(() => { if (el.parentNode) el.remove(); }, 2600);
    }

    fermer(valide) {
      this.overlay.remove();
      if (this.cb && this.cb.fin) this.cb.fin(!!valide, this.photo);
    }
  }

  global.Annotation = { ouvrir: function (photo, cb) { return new Editeur(photo, cb); }, dessinerAnnotation: dessinerAnnotation, chargerImage: chargerImage };
})(window);

</script>

<script>
/* ===== ui.js ===== */
/* =========================================================================
   BFR-CHANTIER — OUTILS D'INTERFACE
   -------------------------------------------------------------------------
   Petits utilitaires réutilisés par tous les écrans : messages, feuilles
   du bas, blocs de saisie, signature au doigt, dictée, photos compressées,
   partage du PDF. Aucune dépendance.
   ========================================================================= */
(function (global) {
  'use strict';

  /* rendu d'une icône BFR : ICO('nom', taille) */
  function ICO(nom, taille) { return (global.ICO && global.ICO.i(nom, taille)) || ''; }

  function $(sel, racine) { return (racine || document).querySelector(sel); }
  function $$(sel, racine) { return Array.prototype.slice.call((racine || document).querySelectorAll(sel)); }

  /* Échappe le texte destiné au HTML */
  function esc(t) {
    return String(t === undefined || t === null ? '' : t)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
  }
  /* Échappe pour un attribut entre guillemets doubles */
  function attr(t) { return esc(t); }

  function vibrer(ms) { try { if (navigator.vibrate) navigator.vibrate(ms || 18); } catch (e) { } }

  var minuterie = null;
  function toast(message, type) {
    var z = document.getElementById('toast');
    if (!z) return;
    z.innerHTML = '<div class="toast ' + (type || '') + '">' + esc(message) + '</div>';
    z.classList.add('visible');
    clearTimeout(minuterie);
    minuterie = setTimeout(function () { z.classList.remove('visible'); }, 3200);
  }

  /* ------------------------------- Feuilles ---------------------------- */

  /* Feuille du bas : formulaire ou choix. Renvoie l'élément créé.
     opts : { titre, contenu (HTML), boutons:[{libelle, classe, action(el)}],
              pleine (bool), surFermeture(fn) } */
  function feuille(opts) {
    var o = opts || {};
    var ov = document.createElement('div');
    ov.className = 'feuille-fond';
    var boutons = (o.boutons || []).map(function (b, i) {
      return '<button type="button" class="btn ' + (b.classe || 's') + '" data-fb="' + i + '">' + esc(b.libelle) + '</button>';
    }).join('');
    ov.innerHTML =
      '<div class="feuille ' + (o.pleine ? 'pleine' : '') + '" role="dialog">' +
        '<div class="feuille-tete">' +
          '<h3>' + esc(o.titre || '') + '</h3>' +
          '<button type="button" class="iconbtn" data-fb="fermer" aria-label="Fermer">' + ICO('fermer', 18) + '</button>' +
        '</div>' +
        '<div class="feuille-corps">' + (o.contenu || '') + '</div>' +
        (boutons ? '<div class="feuille-pied">' + boutons + '</div>' : '') +
      '</div>';
    document.body.appendChild(ov);
    document.body.classList.add('sans-defilement');
    requestAnimationFrame(function () { ov.classList.add('visible'); });

    function fermer() {
      ov.classList.remove('visible');
      setTimeout(function () {
        ov.remove();
        document.body.classList.remove('sans-defilement');
        if (o.surFermeture) o.surFermeture();
      }, 160);
    }
    ov.addEventListener('click', function (e) {
      if (e.target === ov) { fermer(); return; }
      var b = e.target.closest('[data-fb]');
      if (!b) return;
      var idx = b.getAttribute('data-fb');
      if (idx === 'fermer') { fermer(); return; }
      var def = (o.boutons || [])[Number(idx)];
      if (!def) { fermer(); return; }
      /* un bouton sans action (Compris, Fermer, Ok…) referme la feuille */
      if (def.action) def.action(ov, fermer);
      else fermer();
    });
    feuille.derniere = ov;
    return ov;
  }

  function confirmer(question, surOui, libelleOui) {
    feuille({
      titre: 'Confirmation',
      contenu: '<p class="texte">' + esc(question) + '</p>',
      boutons: [
        { libelle: 'Annuler', classe: 's' },
        { libelle: libelleOui || 'Confirmer', classe: 'o', action: function (ov, fermer) { fermer(); surOui(); } }
      ]
    });
  }

  /* ------------------------------ Dictée ------------------------------- */

  function dicteeDisponible() {
    return !!(global.SpeechRecognition || global.webkitSpeechRecognition);
  }

  /* Dicte dans le champ texte ciblé. cible = textarea/input */
  function dicter(cible, surEtat) {
    var SR = global.SpeechRecognition || global.webkitSpeechRecognition;
    if (!SR) { toast('Dictée indisponible sur ce navigateur'); return; }
    var rec = new SR();
    rec.lang = 'fr-FR';
    rec.continuous = true;
    rec.interimResults = false;
    var base = cible.value ? cible.value + ' ' : '';
    if (surEtat) surEtat(true);
    rec.onresult = function (e) {
      for (var i = e.resultIndex; i < e.results.length; i++) {
        if (e.results[i].isFinal) base += e.results[i][0].transcript + ' ';
      }
      cible.value = base.replace(/\s+/g, ' ').trim();
      cible.dispatchEvent(new Event('input', { bubbles: true }));
    };
    rec.onerror = function () { if (surEtat) surEtat(false); };
    rec.onend = function () { if (surEtat) surEtat(false); };
    try { rec.start(); } catch (e) { if (surEtat) surEtat(false); }
    return rec;
  }

  function lire(texte) {
    if (!('speechSynthesis' in global)) { toast('Relecture vocale indisponible'); return; }
    global.speechSynthesis.cancel();
    var u = new SpeechSynthesisUtterance(texte);
    u.lang = 'fr-FR';
    global.speechSynthesis.speak(u);
  }

  /* ---------------------------- Signature ------------------------------ */

  /* Cassette de signature au doigt. Renvoie une promesse de dataURL PNG
     (ou null si annulé). */
  function signature(titre, signatureExistante) {
    return new Promise(function (resolve) {
      var ov = document.createElement('div');
      ov.className = 'feuille-fond';
      ov.innerHTML =
        '<div class="feuille pleine" role="dialog">' +
          '<div class="feuille-tete"><h3>' + esc(titre || 'Signature') + '</h3>' +
          '<button type="button" class="iconbtn" data-s="fermer" aria-label="Fermer">' + ICO('fermer', 18) + '</button></div>' +
          '<div class="feuille-corps">' +
            '<p class="mini">Signez avec le doigt dans le cadre ci-dessous.</p>' +
            '<div class="signature-zone"><canvas id="sigCanvas"></canvas>' +
            '<div class="signature-vide" id="sigVide">Signer ici</div></div>' +
          '</div>' +
          '<div class="feuille-pied">' +
            '<button type="button" class="btn s" data-s="effacer">Effacer</button>' +
            '<button type="button" class="btn p" data-s="valider">Valider la signature</button>' +
          '</div>' +
        '</div>';
      document.body.appendChild(ov);
      document.body.classList.add('sans-defilement');
      requestAnimationFrame(function () { ov.classList.add('visible'); });

      var cv = $('#sigCanvas', ov);
      var ctx = cv.getContext('2d');
      var dessine = false, trace = false;

      function dimensionner() {
        var r = cv.parentElement.getBoundingClientRect();
        var dpr = Math.min(2.5, global.devicePixelRatio || 1);
        cv.width = Math.round(r.width * dpr);
        cv.height = Math.round(r.height * dpr);
        cv.style.width = r.width + 'px';
        cv.style.height = r.height + 'px';
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
        ctx.lineWidth = 2.6;
        ctx.lineCap = 'round';
        ctx.lineJoin = 'round';
        ctx.strokeStyle = '#1e3a8a';
        if (signatureExistante && !dessine) {
          var img = new Image();
          img.onload = function () { ctx.drawImage(img, 0, 0, r.width, r.height); dessine = true; };
          img.src = signatureExistante;
        }
      }
      setTimeout(dimensionner, 30);
      global.addEventListener('resize', dimensionner);

      function pos(e) {
        var r = cv.getBoundingClientRect();
        var p = e.touches ? e.touches[0] : e;
        return { x: p.clientX - r.left, y: p.clientY - r.top };
      }
      function debut(e) { e.preventDefault(); trace = true; var p = pos(e); ctx.beginPath(); ctx.moveTo(p.x, p.y); }
      function move(e) {
        if (!trace) return;
        e.preventDefault();
        var p = pos(e);
        ctx.lineTo(p.x, p.y); ctx.stroke();
        dessine = true;
        var v = $('#sigVide', ov); if (v) v.style.display = 'none';
      }
      function fin() { trace = false; }

      cv.addEventListener('touchstart', debut, { passive: false });
      cv.addEventListener('touchmove', move, { passive: false });
      cv.addEventListener('touchend', fin);
      cv.addEventListener('mousedown', debut);
      cv.addEventListener('mousemove', move);
      global.addEventListener('mouseup', fin);

      function fermer(valeur) {
        ov.classList.remove('visible');
        setTimeout(function () {
          ov.remove();
          document.body.classList.remove('sans-defilement');
          resolve(valeur);
        }, 160);
      }
      ov.addEventListener('click', function (e) {
        var b = e.target.closest('[data-s]');
        if (!b) { if (e.target === ov) fermer(null); return; }
        var a = b.getAttribute('data-s');
        if (a === 'fermer') fermer(null);
        else if (a === 'effacer') { ctx.clearRect(0, 0, cv.width, cv.height); dessine = false; var v = $('#sigVide', ov); if (v) v.style.display = ''; }
        else if (a === 'valider') {
          if (!dessine) { toast('Signez dans le cadre avant de valider'); return; }
          fermer(cv.toDataURL('image/png'));
        }
      });
    });
  }

  /* ------------------------------ Photos ------------------------------- */

  function lireFichier(fichier) {
    return new Promise(function (resolve, reject) {
      var fr = new FileReader();
      fr.onload = function () { resolve(fr.result); };
      fr.onerror = reject;
      fr.readAsDataURL(fichier);
    });
  }

  /* Réduit la photo (max 1600 px, JPEG 80 %) pour tenir dans le téléphone */
  function compresser(dataUrl, maxCote) {
    var max = maxCote || 1600;
    return new Promise(function (resolve) {
      var img = new Image();
      img.onload = function () {
        var w = img.width, h = img.height;
        var echelle = Math.min(1, max / Math.max(w, h));
        w = Math.round(w * echelle); h = Math.round(h * echelle);
        var cv = document.createElement('canvas');
        cv.width = w; cv.height = h;
        var ctx = cv.getContext('2d');
        ctx.drawImage(img, 0, 0, w, h);
        try { resolve(cv.toDataURL('image/jpeg', 0.8)); }
        catch (e) { resolve(dataUrl); }
      };
      img.onerror = function () { resolve(dataUrl); };
      img.src = dataUrl;
    });
  }

  /* Prend une photo (appareil ou galerie) et renvoie un dataURL compressé */
  function prendrePhoto() {
    return new Promise(function (resolve) {
      var inp = document.createElement('input');
      inp.type = 'file';
      inp.accept = 'image/*';
      inp.setAttribute('capture', 'environment');
      inp.style.display = 'none';
      document.body.appendChild(inp);
      inp.addEventListener('change', function () {
        var f = inp.files && inp.files[0];
        inp.remove();
        if (!f) { resolve(null); return; }
        lireFichier(f).then(function (d) { return compresser(d); }).then(resolve).catch(function () { resolve(null); });
      });
      inp.addEventListener('cancel', function () { inp.remove(); resolve(null); });
      inp.click();
    });
  }

  /* ------------------------- Téléchargement / partage ------------------ */

  function telecharger(blob, nom) {
    var url = URL.createObjectURL(blob);
    var a = document.createElement('a');
    a.href = url; a.download = nom;
    document.body.appendChild(a); a.click();
    setTimeout(function () { a.remove(); URL.revokeObjectURL(url); }, 1500);
  }

  /* Partage natif du téléphone (Gmail, WhatsApp…) avec la pièce jointe */
  function partager(fichiers, texte, objet) {
    var fichiersNatifs = (fichiers || []).map(function (f) {
      return new File([f.blob], f.nom, { type: 'application/pdf' });
    });
    if (global.navigator && navigator.canShare && navigator.canShare({ files: fichiersNatifs })) {
      return navigator.share({ files: fichiersNatifs, text: texte, title: objet || '' })
        .then(function () { return 'partage'; })
        .catch(function () { return 'annule'; });
    }
    return Promise.resolve('indisponible');
  }

  function copier(texte) {
    if (navigator.clipboard && navigator.clipboard.writeText) {
      return navigator.clipboard.writeText(texte).then(function () { return true; }).catch(function () { return false; });
    }
    try {
      var ta = document.createElement('textarea');
      ta.value = texte; document.body.appendChild(ta); ta.select();
      document.execCommand('copy'); ta.remove();
      return Promise.resolve(true);
    } catch (e) { return Promise.resolve(false); }
  }

  /* Valeur courante d'un champ : lue dans l'objet visé (journée, chantier,
     réglages, brouillon) quand elle n'est pas fournie explicitement. */
  function valeurCourante(o) {
    if (o.valeur !== undefined && o.valeur !== null) return o.valeur;
    var A = global.App;
    if (!A || !o.champ || !o.cible) return '';
    var obj = null;
    if (o.cible === 'journee') obj = A.journeeCourante && A.journeeCourante();
    else if (o.cible === 'chantier') obj = A.chantierCourant && A.chantierCourant();
    else if (o.cible === 'reglages') obj = A.etat && A.etat.reglages;
    else if (o.cible === 'nouveau') obj = A.etat && A.etat.nouveau;
    if (!obj) return '';
    var v = String(o.champ).split('.').reduce(function (x, p) {
      return (x === undefined || x === null) ? undefined : x[p];
    }, obj);
    return v === undefined || v === null ? '' : v;
  }

  /* Bloc de saisie réutilisable */
  function blocSaisie(o) {
    var o2 = o || {};
    var id = o2.id || ('c' + Math.random().toString(36).slice(2, 8));
    var valeur = valeurCourante(o2);
    var balise = o2.lignes ? 'textarea' : 'input';
    var attrs = 'id="' + id + '" data-champ="' + attr(o2.champ || '') + '" data-cible="' + attr(o2.cible || 'journee') + '"';

    /* Suggestions : ce que l'utilisateur a l'habitude de saisir d'abord,
       puis le catalogue de référence (Usage.fusionner). */
    var propositions = [];
    if (o2.suggestions && global.Usage) {
      propositions = global.Usage.fusionner(o2.suggestions, o2.catalogue || [], o2.limiteSuggestions || 40);
      if (propositions.length) {
        attrs += ' list="dl-' + id + '" autocomplete="off"';
      }
    }
    var listeSuggestions = propositions.length
      ? '<datalist id="dl-' + id + '">' + propositions.map(function (v) {
          return '<option value="' + attr(v) + '"></option>';
        }).join('') + '</datalist>'
      : '';

    /* Raccourcis : les plus utilisés par cet utilisateur, en un appui */
    var raccourcis = '';
    if (o2.suggestions && global.Usage) {
      var pop = global.Usage.populaires(o2.suggestions, o2.limiteChips || 4);
      if (pop.length) {
        raccourcis = '<div class="suggestion-titre">' + (o2.titreRaccourcis || 'Vos saisies les plus fréquentes') + '</div>' +
          '<div class="suggestions">' + pop.map(function (p2) {
            return '<button type="button" class="suggestion" data-a="utiliser-suggestion" data-vers="' + id + '" ' +
              'data-valeur="' + attr(p2.valeur) + '">' + esc(p2.valeur) + ' <span class="n">×' + p2.n + '</span></button>';
          }).join('') + '</div>';
      }
    }
    if (o2.type) attrs += ' type="' + o2.type + '"';
    if (o2.inputmode) attrs += ' inputmode="' + o2.inputmode + '"';
    if (o2.placeholder) attrs += ' placeholder="' + attr(o2.placeholder) + '"';
    if (o2.min !== undefined) attrs += ' min="' + o2.min + '"';
    if (o2.max !== undefined) attrs += ' max="' + o2.max + '"';
    if (o2.etape !== undefined) attrs += ' step="' + o2.etape + '"';
    var corps = balise === 'textarea'
      ? '<textarea ' + attrs + ' rows="' + (o2.rangees || 3) + '">' + esc(valeur) + '</textarea>'
      : '<input ' + attrs + ' value="' + attr(valeur) + '">';
    return '<label class="champ' + (o2.classe ? ' ' + o2.classe : '') + '">' +
      (o2.libelle ? '<span class="champ-titre">' + esc(o2.libelle) +
        (o2.dictee ? '<button type="button" class="mini-btn" data-a="dicter" data-vers="' + id + '">' + ICO('micro', 15) + 'Dicter</button>' : '') +
        '</span>' : '') +
      corps + listeSuggestions + '</label>' + raccourcis;
  }

  /* Liste déroulante construite sur un catalogue, avec un choix « Autre »
     qui ouvre la saisie libre. Renvoie du HTML ; l'affichage du champ libre
     est piloté par l'appelant (classe « cache »). */
  function champListe(o) {
    var o2 = o || {};
    var id = o2.id;
    var idLibre = o2.idLibre || (id + 'Libre');
    var pop = (global.Usage && o2.suggestions) ? global.Usage.populaires(o2.suggestions, o2.limitePopulaires || 6) : [];
    var valeur = o2.valeur === undefined || o2.valeur === null ? '' : String(o2.valeur);
    var dansCatalogue = (o2.catalogue || []).some(function (v) { return v === valeur; }) ||
      pop.some(function (p2) { return p2.valeur === valeur; });
    var choixAutre = valeur !== '' && !dansCatalogue;

    function options(liste) {
      return liste.map(function (v) {
        var val = (typeof v === 'string') ? v : v.valeur;
        var suppl = (typeof v === 'string') ? '' : ' <span class="mini">×' + v.n + '</span>';
        return '<option value="' + attr(val) + '"' + (val === valeur ? ' selected' : '') + '>' + esc(val) + suppl + '</option>';
      }).join('');
    }

    var h = '<label class="champ"><span class="champ-titre">' + esc(o2.libelle || '') + '</span>' +
      '<select id="' + id + '">' +
      '<option value=""' + (valeur === '' ? ' selected' : '') + '>— choisir dans la liste —</option>' +
      (pop.length ? '<optgroup label="Vos ' + esc(o2.titrePopulaires || 'choix les plus fréquents') + '">' + options(pop) + '</optgroup>' : '') +
      (o2.catalogue && o2.catalogue.length ? '<optgroup label="' + esc(o2.titreCatalogue || 'Liste courante') + '">' + options(o2.catalogue) + '</optgroup>' : '') +
      '<option value="__AUTRE__"' + (choixAutre ? ' selected' : '') + '>Autre (saisie libre)</option>' +
      '</select></label>';

    h += '<div id="' + idLibre + 'Box"' + (choixAutre ? '' : ' class="cache"') + '>' +
      blocSaisie({
        id: idLibre, libelle: o2.libelleLibre || 'Saisie libre', valeur: valeur,
        dictee: o2.dictee, placeholder: o2.placeholder
      }) + '</div>';
    return h;
  }

  global.UI = {
    $: $, $$: $$, esc: esc, attr: attr, toast: toast, vibrer: vibrer,
    feuille: feuille, confirmer: confirmer,
    dicter: dicter, dicteeDisponible: dicteeDisponible, lire: lire,
    signature: signature,
    lireFichier: lireFichier, compresser: compresser, prendrePhoto: prendrePhoto,
    telecharger: telecharger, partager: partager, copier: copier,
    blocSaisie: blocSaisie, valeurCourante: valeurCourante, champListe: champListe
  };
})(window);

</script>
<script>
/* ===== pointsoir.js ===== */
/* =========================================================================
   BFR-CHANTIER — POINT DU SOIR (document PDF et aperçu à l'écran)
   -------------------------------------------------------------------------
   Même mise en page pour le PDF (Pdf.Doc) et pour l'aperçu (Pdf.Apercu) :
   une seule fonction de dessin, appelée avec l'un ou l'autre.
   Document INTERNE : il n'est pas adressé au client et ne porte aucune
   signature de client.
   ========================================================================= */
(function (global) {
  'use strict';

  var M = global.Modele;

  var NOIR = [0.16, 0.16, 0.19];
  var GRIS = [0.39, 0.46, 0.55];
  var NAVY = [0.20, 0.18, 0.45];      // #332e72
  var CYAN = [0.02, 0.73, 0.95];      // #06baf2
  var CYAN_PALE = [0.92, 0.97, 0.99];
  var GRIS_PALE = [0.96, 0.97, 0.98];
  var ROUGE = [0.73, 0.11, 0.11];
  var ARDOISE = [0.29, 0.31, 0.42];      /* bleu ardoise BFR — aucune couleur hors charte */
  var VERT = [0.01, 0.47, 0.34];
  var BORD = [0.86, 0.89, 0.92];

  function police(gras) { return gras ? 'F2' : 'F1'; }

  /* ---------------------------------------------------------------- outils */

  function titreSection(doc, texte) {
    doc.ensure(30);
    doc.rect(doc.margin, doc.y, doc.contentWidth, 14, { fill: NAVY });
    doc.text(texte.toUpperCase(), doc.margin + 6, doc.y + 10.4, { size: 8.6, font: 'F2', color: [1, 1, 1] });
    doc.y += 14 + 3.4;      /* espacement resserré : la journée tient sur une page */
  }

  function sousTitre(doc, texte) {
    doc.ensure(14);
    doc.text(texte, doc.margin, doc.y + 8, { size: 8.4, font: 'F2', color: NAVY });
    doc.y += 12;
  }

  function ligne(doc, texte, opts) {
    opts = opts || {};
    var size = opts.size || 8.6;
    var h = doc.paragraphHeight(texte, doc.contentWidth - (opts.retrait || 0), size);
    doc.ensure(h + 2);
    doc.y = doc.paragraph(texte, doc.margin + (opts.retrait || 0), doc.y, doc.contentWidth - (opts.retrait || 0), {
      size: size, color: opts.color || NOIR, bold: !!opts.bold, lineHeight: size * 1.35
    }) + 2;
  }

  /* Tableau simple : entetes[], lignes[][] (chaque cellule = texte) */
  function tableau(doc, entetes, lignes, largeurs, opts) {
    opts = opts || {};
    var size = opts.size || 8;
    var lh = size * 1.35;
    var total = largeurs.reduce(function (a, b) { return a + b; }, 0);
    var dispo = doc.contentWidth;
    var cols = largeurs.map(function (l) { return (l / total) * dispo; });

    function hauteurLigne(cellules) {
      var h = 0;
      cellules.forEach(function (c, i) {
        var hauteur = doc.paragraphHeight(String(c == null ? '' : c), cols[i] - 8, size);
        if (hauteur > h) h = hauteur;
      });
      return h + 5;
    }

    /* en-tête */
    var hEntete = hauteurLigne(entetes);
    doc.ensure(hEntete + 14);
    doc.rect(doc.margin, doc.y, dispo, hEntete, { fill: [0.93, 0.96, 0.98] });
    var x = doc.margin;
    entetes.forEach(function (c, i) {
      doc.text(String(c), x + 4, doc.y + size + 1.5, { size: size, font: 'F2', color: NAVY });
      x += cols[i];
    });
    doc.y += hEntete;

    /* lignes */
    lignes.forEach(function (l, index) {
      var h = hauteurLigne(l);
      if (doc.y + h > doc.H - doc.margin - 24) {
        doc.newPage();
        doc.ensure(hEntete + 10);
        doc.rect(doc.margin, doc.y, dispo, hEntete, { fill: [0.93, 0.96, 0.98] });
        var xx = doc.margin;
        entetes.forEach(function (c, i) {
          doc.text(String(c), xx + 4, doc.y + size + 1.5, { size: size, font: 'F2', color: NAVY });
          xx += cols[i];
        });
        doc.y += hEntete;
      }
      if (index % 2 === 1) doc.rect(doc.margin, doc.y, dispo, h, { fill: GRIS_PALE });
      var x2 = doc.margin;
      l.forEach(function (c, i) {
        doc.paragraph(String(c == null ? '' : c), x2 + 4, doc.y + 3, cols[i] - 8, { size: size, color: NOIR });
        x2 += cols[i];
      });
      doc.line(doc.margin, doc.y + h, doc.margin + dispo, doc.y + h, { color: BORD, width: 0.5 });
      doc.y += h;
    });
    doc.y += 6;
  }

  /* =========================== Dessin du document ====================== */

  function dessiner(doc, ctx) {
    var ch = ctx.chantier, j = ctx.journee, S = ctx.reglages || {};
    var c = M.compteurs(j, ctx.cumul);
    var avancement = ctx.avancement;

    /* ------------------------------ en-tête --------------------------- */
    var y0 = doc.margin;
    var logo = (S.societe && S.societe.logo) || global.LOGO_BFR || '';
    var largeurTexte = doc.contentWidth;
    if (logo) {
      try {
        var octets = Pdf.dataUrlToBytes(logo);
        var dim = (global.Pdf.jpegDims ? Pdf.jpegDims(octets) : null);
        var h = 26, w = 92;
        if (dim && dim.h) { w = 26 * (dim.w / dim.h); if (w > 130) { w = 130; h = 130 / (dim.w / dim.h); } }
        doc.image(octets, doc.margin, y0, w, h);
        largeurTexte = doc.contentWidth - (w + 12);
      } catch (e) { /* logo illisible : on continue sans */ }
    }
    var xDroite = doc.margin + doc.contentWidth;
    doc.text('POINT DU SOIR', xDroite, y0 + 9, { size: 14, font: 'F2', color: NAVY, align: 'right' });
    doc.text((S.societe && S.societe.nom) || 'BFR SYSTEMS', xDroite, y0 + 19, { size: 7.6, color: GRIS, align: 'right' });
    doc.rect(doc.margin, y0 + 30, doc.contentWidth, 1.4, { fill: CYAN });
    doc.y = y0 + 40;

    /* identification du chantier */
    var titre = (ch.numeroAffaire ? ch.numeroAffaire + ' · ' : '') + (ch.libelle || 'Chantier');
    ligne(doc, titre, { size: 12, bold: true, color: NAVY });
    var sous = [];
    if (ch.client && ch.client.nom) sous.push(ch.client.nom + (ch.client.ville ? ' — ' + ch.client.ville : ''));
    if (ch.client && ch.client.site) sous.push('Site : ' + ch.client.site);
    sous.push('Journée ' + j.numero + (ch.dureePrevueJours ? ' sur ' + ch.dureePrevueJours + ' prévues' : ''));
    sous.push(M.texteDate(j.date));
    if (ctx.auteur) sous.push('Établi par : ' + ctx.auteur);
    ligne(doc, sous.join('   ·   '), { size: 8.4, color: GRIS });
    if (j.version > 1) ligne(doc, 'Version ' + j.version + ' (corrigée après envoi)', { size: 8, color: ARDOISE, bold: true });

    /* ------------------------- l'essentiel ---------------------------- */
    var synth = j.synthese || '—';
    var hSynth = doc.paragraphHeight(synth, doc.contentWidth - 18, 9.6, false) + 16;
    doc.ensure(hSynth + 20);
    doc.rect(doc.margin, doc.y, doc.contentWidth, hSynth, { fill: CYAN_PALE });
    doc.rect(doc.margin, doc.y, 3, hSynth, { fill: CYAN });
    doc.text('L\'ESSENTIEL', doc.margin + 9, doc.y + 11, { size: 7.4, font: 'F2', color: NAVY });
    doc.paragraph(synth, doc.margin + 9, doc.y + 14, doc.contentWidth - 18, { size: 9.6, color: NOIR });
    doc.y += hSynth + 10;

    /* -------------------------- 1. avancement ------------------------- */
    titreSection(doc, '1. Avancement du chantier');
    doc.ensure(30);
    doc.text(avancement + ' %', doc.margin, doc.y + 14, { size: 20, font: 'F2', color: NAVY });
    var xBarre = doc.margin + 70;
    var largeurBarre = doc.contentWidth - 70;
    doc.rect(xBarre, doc.y + 6, largeurBarre, 8, { fill: [0.91, 0.94, 0.96] });
    var rempli = Math.max(0, Math.min(1, avancement / 100)) * largeurBarre;
    if (rempli > 0) doc.rect(xBarre, doc.y + 6, rempli, 8, { fill: CYAN });
    if (ctx.variation) {
      doc.text((ctx.variation > 0 ? '+ ' : '') + ctx.variation + ' points par rapport à la veille',
        xBarre, doc.y + 24, { size: 7.6, color: GRIS });
    }
    doc.y += 30;
    var termines = [], enCours = [], aVenir = [];
    (ch.jalons || []).forEach(function (jal) {
      var a = Number(jal.avancement) || 0;
      if (a >= 100) termines.push(jal.libelle);
      else if (a > 0) enCours.push(jal.libelle + ' (' + a + ' %)');
      else aVenir.push(jal.libelle);
    });
    if (termines.length) ligne(doc, 'Terminé : ' + termines.join(' · '), { size: 8.2 });
    if (enCours.length) ligne(doc, 'En cours : ' + enCours.join(' · '), { size: 8.2 });
    if (aVenir.length) ligne(doc, 'À venir : ' + aVenir.join(' · '), { size: 8.2, color: GRIS });

    /* ------------------------ 2. effectif et heures ------------------- */
    titreSection(doc, '2. Effectif et heures');
    var detail = (j.effectif && j.effectif.detail) ? j.effectif.detail : '';
    tableau(doc, ['Effectif sur site', 'Heures'], [
      [(j.effectif && j.effectif.nb ? j.effectif.nb : 0) + ' personne(s)' + (detail ? ' — ' + detail : ''),
        M.texteHeures(M.dureeJourneeMn(j))],
      ['Total hommes-heures du jour', M.texteHeuresDec(c.hommesHeures)],
      ['Cumul hommes-heures du chantier', M.texteHeuresDec(ctx.cumul === undefined ? c.hommesHeures : ctx.cumul)]
    ], [70, 30]);

    /* ------------------------- 3. travaux réalisés -------------------- */
    var faits = (j.taches || []).filter(function (t) { return t.etat === 'FAIT' || t.etat === 'PARTIEL'; });
    if (faits.length || (j.actions || []).length) {
      titreSection(doc, '3. Travaux réalisés');
      faits.forEach(function (t) {
        var txt = (t.etat === 'FAIT' ? '✓ ' : '◐ ') + t.libelle;
        if (t.avancement) txt += '  (+' + t.avancement + ' % sur ' + (libelleJalon(ch, t.jalonId) || 'le jalon') + ')';
        ligne(doc, txt, { size: 8.4 });
      });
      (j.actions || []).filter(function (a) { return a.categorie === 'AVANCEMENT' && a.texte; })
        .forEach(function (a) { ligne(doc, '· ' + a.texte, { size: 8.4, color: GRIS }); });
    }

    /* ---------------------- 4. prévu et non réalisé ------------------- */
    var nonFaits = (j.taches || []).filter(function (t) { return t.etat === 'NON_FAIT'; });
    if (nonFaits.length) {
      titreSection(doc, '4. Prévu et non réalisé');
      nonFaits.forEach(function (t) {
        ligne(doc, '✕ ' + t.libelle + (t.motif ? ' — motif : ' + t.motif : ''), { size: 8.4 });
      });
    }

    /* --------------------- 5. blocages et écarts ---------------------- */
    titreSection(doc, '5. Blocages et écarts');
    var ouverts = ctx.blocagesOuverts || [];
    if (!ouverts.length) {
      ligne(doc, 'Aucun blocage à signaler.', { size: 8.4, color: VERT });
    } else {
      var lignesBlocages = ouverts.map(function (o) {
        var b = o.blocage;
        var grav = M.parId(M.GRAVITES, Number(b.gravite));
        var desc = b.description;
        if (o.anciennete > 0) desc += '  (ouvert le ' + M.texteDateCourt(b.ouvertLe || o.date) + ' — ' + o.anciennete + ' j)';
        if (o.persistant) desc += '  — bloque depuis ' + o.anciennete + ' jours';
        return [
          (grav ? grav.court : b.gravite),
          desc,
          M.libelle(M.DEBLOQUEURS, b.debloqueur) + (b.impactJours ? ' · impact ' + b.impactJours + ' j' : ''),
          b.echeance || '—'
        ];
      });
      tableau(doc, ['Gravité', 'Description', 'Qui peut débloquer', 'Pour quand'], lignesBlocages, [16, 46, 24, 14]);
      var graves = ouverts.filter(function (o) { return Number(o.blocage.gravite) === 1; });
      if (graves.length) ligne(doc, '!' + ' ' + graves.length + ' blocage(s) de gravité 1 : action attendue sous 24 h.', { size: 8.4, bold: true, color: ROUGE });
    }

    /* ---------------------- 6. approvisionnement --------------------- */
    var mat = j.materiel || [];
    if (mat.length) {
      titreSection(doc, '6. Approvisionnement et matériel');
      tableau(doc, ['État', 'Référence', 'Désignation', 'Qté', 'Besoin le'], mat.map(function (m) {
        return [
          M.libelle(M.ETATS_MATERIEL, m.etat),
          m.reference || '—',
          m.designation || '—',
          m.qte || '',
          m.etat === 'MANQUANT' && m.besoinLe ? M.texteDateCourt(m.besoinLe) : '—'
        ];
      }), [16, 16, 40, 8, 14]);
    }

    /* --------------------------- 7. sécurité ------------------------- */
    titreSection(doc, '7. Sécurité');
    var incidents = (j.securite && j.securite.incidents) || [];
    if (!incidents.length) {
      ligne(doc, 'Aucun incident ni presqu\'accident signalé ce jour.', { size: 8.4, color: VERT });
    } else {
      incidents.forEach(function (i) {
        ligne(doc, '• ' + (i.description || '') + (i.gravite ? '  [' + i.gravite + ']' : ''), { size: 8.4, color: ROUGE });
      });
    }
    if (j.securite && j.securite.remarques) ligne(doc, 'Remarques : ' + j.securite.remarques, { size: 8.2, color: GRIS });

    /* ----------------------- 8. essais et contrôles ------------------ */
    if ((j.essais || []).length) {
      titreSection(doc, '8. Essais et contrôles');
      tableau(doc, ['Essai', 'Résultat', 'Mesures / observation'], (j.essais || []).map(function (e) {
        return [e.libelle || '—', M.libelle(M.RESULTATS_ESSAI, e.resultat), (e.mesures || '') + (e.contreVisite ? '  (contre-visite nécessaire)' : '')];
      }), [30, 14, 56]);
    }

    /* ---------------------------- 9. formation ----------------------- */
    if (j.formation && (j.formation.participants || []).length) {
      titreSection(doc, '9. Formation du jour');
      var f = j.formation;
      ligne(doc, (f.intitule || 'Session') + ' · ' + M.libelle(M.TYPES_FORMATION, f.type) +
        ' · ' + (f.dureeH || 0) + ' h · formateur : ' + (f.formateur || ctx.auteur || '—'), { size: 8.4, bold: true });
      tableau(doc, ['Participant', 'Fonction', 'Acquis', 'Signature'], (f.participants || []).map(function (p) {
        return [p.nom || '—', p.fonction || '', M.libelle(M.ACQUIS, p.acquis), p.signature ? 'signé' : 'non signé'];
      }), [30, 30, 20, 20]);
      var traites = (f.programme || []).filter(function (m) { return m.traite; });
      if (traites.length) ligne(doc, 'Thèmes traités : ' + traites.map(function (m) { return m.libelle; }).join(' · '), { size: 8.2, color: GRIS });
    }

    /* -------------------------- 10. coactivité ----------------------- */
    if ((j.coactivite || []).length) {
      titreSection(doc, '10. Coactivité et sous-traitants');
      (j.coactivite || []).forEach(function (co) {
        ligne(doc, '· ' + (co.entreprise || '—') + (co.effectif ? ' (' + co.effectif + ' pers.)' : '') + (co.remarque ? ' — ' + co.remarque : ''), { size: 8.4 });
      });
    }

    /* -------------------------- 11. prévu demain --------------------- */
    titreSection(doc, '11. Prévu demain');
    var prevu = (j.prevuDemain && j.prevuDemain.taches) || [];
    if (prevu.length) {
      prevu.forEach(function (t) { ligne(doc, '→ ' + t, { size: 8.4 }); });
    } else {
      ligne(doc, '—', { size: 8.4, color: GRIS });
    }
    if (j.prevuDemain && j.prevuDemain.effectif) ligne(doc, 'Effectif prévu : ' + j.prevuDemain.effectif + ' personne(s)', { size: 8.2, color: GRIS });
    var besoins = (j.prevuDemain && j.prevuDemain.besoins) || [];
    if (besoins.length) ligne(doc, 'Besoins : ' + besoins.join(' · '), { size: 8.2, color: GRIS });

    /* --------------------- 12. demandes aux responsables ------------- */
    if (besoins.length || ouverts.length) {
      titreSection(doc, '12. Demandes aux responsables');
      ouverts.forEach(function (o) {
        var b = o.blocage;
        /* action attendue, puis le blocage concerné : les deux sont lisibles
           séparément (l'action est une demande, la description un constat) */
        var demande = (b.action || '').trim();
        ligne(doc, '• ' + M.libelle(M.DEBLOQUEURS, b.debloqueur) + ' — ' +
          (demande ? demande + ' : ' : '') + b.description +
          (b.echeance ? ' (' + b.echeance + ')' : ''), { size: 8.4 });
      });
      besoins.forEach(function (b2) { ligne(doc, '• ' + b2, { size: 8.4 }); });
    }

    /* ----------------------------- 13. photos ------------------------ */
    var photos = ctx.photos || [];
    if (photos.length) {
      titreSection(doc, '13. Photos');
      var parLigne = 3;
      var largeur = (doc.contentWidth - 8 * (parLigne - 1)) / parLigne;
      var i = 0;
      while (i < photos.length) {
        var hauteurMax = 0;
        var lot = [];
        for (var k = 0; k < parLigne && i + k < photos.length; k++) {
          var ph = photos[i + k];
          try {
            var oct = Pdf.dataUrlToBytes(ph.dataUrl);
            var d = Pdf.jpegDims ? Pdf.jpegDims(oct) : null;
            var hh = d && d.w ? largeur * (d.h / d.w) : largeur * 0.7;
            if (hh > hauteurMax) hauteurMax = hh;
            lot.push({ octets: oct, h: hh, legende: ph.legende || '' });
          } catch (e) { /* photo illisible : ignorée */ }
        }
        if (!lot.length) break;
        hauteurMax = Math.min(hauteurMax, 150);
        var hauteurTotale = hauteurMax + 14;
        doc.ensure(hauteurTotale + 6);
        var xp = doc.margin;
        lot.forEach(function (l) {
          doc.image(l.octets, xp, doc.y, largeur, Math.min(l.h, hauteurMax));
          if (l.legende) doc.text(l.legende.slice(0, 60), xp, doc.y + Math.min(l.h, hauteurMax) + 8, { size: 6.8, color: GRIS });
          xp += largeur + 8;
        });
        doc.y += hauteurTotale;
        i += parLigne;
      }
    }

    /* ---------------------------- 14. diffusion ---------------------- */
    /* la section reste d'un seul bloc : jamais de titre orphelin en bas de page */
    doc.ensure(58);
    titreSection(doc, '14. Diffusion et visas internes');
    var dest = ctx.destinataires || [];
    var destTxt = dest.filter(function (d) { return !d.copie; }).map(function (d) {
      return d.libelle + (d.nom ? ' (' + d.nom + ')' : '');
    }).join(' · ');
    var copieTxt = dest.filter(function (d) { return d.copie; }).map(function (d) { return d.libelle + (d.nom ? ' (' + d.nom + ')' : ''); }).join(' · ');
    var alertes = M.alerteGrave(j);
    if (alertes.alerte) ligne(doc, 'Alerte du jour : ' + (alertes.gravite1.length ? alertes.gravite1.length + ' blocage(s) de gravité 1' : '') +
      (alertes.securite.length ? (alertes.gravite1.length ? ' · ' : '') + alertes.securite.length + ' incident(s) de sécurité' : '') +
      ' — direction technique en copie.', { size: 8.2, bold: true, color: ROUGE });
    ligne(doc, 'Destinataires : ' + (destTxt || '—'), { size: 8.2 });
    if (copieTxt) ligne(doc, 'En copie : ' + copieTxt, { size: 8.2, color: GRIS });
    ligne(doc, 'Document interne BFR Systems — non adressé au client.', { size: 7.8, color: GRIS });

    /* ----------------------------- pied de page ---------------------- */
    var reference = (ch.numeroAffaire ? ch.numeroAffaire + ' · ' : '') + 'Point du soir — J' + j.numero + ' — ' + M.texteDateCourt(j.date);
    doc.addFooters(function (doc2, page, total) {
      doc2.line(doc2.margin, doc2.H - doc2.margin + 4, doc2.margin + doc2.contentWidth, doc2.H - doc2.margin + 4, { color: BORD, width: 0.6 });
      doc2.text(reference, doc2.margin, doc2.H - doc2.margin + 13, { size: 6.8, color: GRIS });
      var soc = S.societe || {};
      doc2.text([soc.nom, soc.cpVille, soc.tel].filter(Boolean).join(' · ') + '   |   Document interne — diffusion restreinte',
        doc2.margin + doc2.contentWidth, doc2.H - doc2.margin + 13, { size: 6.8, color: GRIS, align: 'right' });
      doc2.text('Page ' + page + ' / ' + total, doc2.margin + doc2.contentWidth, doc2.H - doc2.margin + 4, { size: 6.8, color: GRIS, align: 'right' });
    });

    return doc;
  }

  /* Libellé d'un jalon (utilitaire local, tolérant) */
  function libelleJalon(chantier, jalonId) {
    if (!jalonId) return '';
    var j = M.parId(chantier.jalons || [], jalonId);
    return j ? j.libelle : '';
  }

  var Pdf = global.Pdf;

  /* ------------------------------- Fabriques --------------------------- */

  function document(ctx) {
    var doc = new Pdf.Doc({ margin: 36 });
    dessiner(doc, ctx);
    return { blob: doc.blob(), doc: doc };
  }

  function apercu(ctx) {
    var doc = new Pdf.Apercu({ margin: 36 });
    dessiner(doc, ctx);
    return doc;
  }

  /* ------------------------------ Textes mail -------------------------- */

  function message(ctx) {
    var S = ctx.reglages || {};
    var u = S.utilisateur || {};
    var signataire = (S.mail && S.mail.signatureTexte) ||
      ['Cordialement', '', [u.prenom, u.nom].filter(Boolean).join(' ') + (u.fonction ? ' — ' + u.fonction : ''),
        (S.societe && S.societe.nom) || '', u.tel || ''].filter(Boolean).join('\n');
    var destinataires = ctx.destinataires || [];
    var adresses = destinataires.filter(function (d) { return d.email; }).map(function (d) { return d.email; });
    return {
      objet: (S.mail && S.mail.objet) ? S.mail.objet
        .replace(/\{\{numeroAffaire\}\}/g, ctx.chantier.numeroAffaire || '')
        .replace(/\{\{chantier\}\}/g, ctx.chantier.libelle || '')
        .replace(/\{\{jour\}\}/g, String(ctx.journee.numero))
        .replace(/\{\{date\}\}/g, M.texteDateCourt(ctx.journee.date))
        : M.objetMail(ctx.chantier, ctx.journee, M.compteurs(ctx.journee, ctx.cumul)),
      corps: M.corpsMail(ctx.chantier, ctx.journee, ctx.avancement, {
        cumul: ctx.cumul,
        blocagesOuverts: ctx.blocagesOuverts,
        signataire: signataire
      }),
      destinataires: destinataires,
      adresses: adresses,
      messagePartage: (S.mail && S.mail.messagePartage) || ''
    };
  }

  global.PointSoir = {
    dessiner: dessiner,
    document: document,
    apercu: apercu,
    message: message
  };
})(window);

</script>
<script>
/* ===== ecrans.js ===== */
/* =========================================================================
   BFR-CHANTIER — ÉCRANS
   -------------------------------------------------------------------------
   Chaque fonction renvoie le HTML d'un écran. Les interactions passent par
   des attributs data-a="action" (gérés dans app.js) et data-champ (saisie).
   ========================================================================= */
(function (global) {
  'use strict';

  var M = global.Modele;
  var U = global.UI;
  /* jeu d'icônes vectorielles BFR — aucun émoji dans l'interface */
  function I(nom, taille, cls) { return (global.ICO && global.ICO.i(nom, taille, cls)) || ''; }
  var Usage = global.Usage || { populaires: function () { return []; }, resume: function () { return []; }, utilisateurCourant: function () { return ''; } };

  /* ------------------------------ fragments ---------------------------- */

  function barre(pct, classe) {
    return '<div class="barre ' + (classe || '') + '"><i style="width:' + Math.max(0, Math.min(100, pct)) + '%"></i></div>';
  }

  function pastille(texte, couleur, fond) {
    return '<span class="tag" style="color:' + couleur + ';background:' + fond + ';border-color:' + couleur + '33">' + U.esc(texte) + '</span>';
  }

  function statutTag(id) {
    var s = M.parId(M.STATUTS, id) || { libelle: id, couleur: '#64748b' };
    return pastille(s.libelle, s.couleur, s.couleur + '18');
  }

  function graviteTag(g) {
    var gr = M.parId(M.GRAVITES, Number(g)) || M.GRAVITES[2];
    return pastille(gr.court, gr.couleur, gr.fond);
  }

  function entete(titre, sous, retour, actionDroite) {
    return '<header class="topbar">' +
      '<div class="topbar-gauche">' +
        (retour ? '<button type="button" class="iconbtn" data-a="' + retour + '" aria-label="Retour">' + I('retour', 20) + '</button>' : '') +
        '<div><div class="topbar-titre">' + U.esc(titre) + '</div>' +
        (sous ? '<div class="topbar-sous">' + U.esc(sous) + '</div>' : '') + '</div>' +
      '</div>' +
      (actionDroite || '<button type="button" class="iconbtn" data-a="menu" aria-label="Menu">' + I('menu', 20) + '</button>') +
      '</header>';
  }

  function vide(texte) {
    return '<div class="vide">' + U.esc(texte) + '</div>';
  }

  /* ============================== 1. ACCUEIL =========================== */

  function accueil() {
    var A = global.App;
    var etat = A.etat;
    var today = M.aujourdhui();
    var enCours = etat.chantiers.filter(function (c) { return c.statut === 'EN_COURS' || c.statut === 'ATTENTE' || c.statut === 'SUSPENDU'; });
    var prevus = etat.chantiers.filter(function (c) { return c.statut === 'PREVU'; });
    var clotures = etat.chantiers.filter(function (c) { return c.statut === 'CLOTURE' || c.statut === 'RECEPTIONNE'; });

    var html = entete('BFR Chantier', 'Installation · mise en service · formation', null);

    /* alertes : journées non clôturées */
    var alertes = [];
    etat.chantiers.forEach(function (ch) {
      A.journeesDe(ch.id).forEach(function (j) {
        if (j.statut !== 'CLOTUREE' && j.date === today && (j.actions || []).length + (j.taches || []).length > 0) {
          alertes.push({ chantier: ch, journee: j });
        }
        if (j.statut !== 'CLOTUREE' && j.date < today) {
          alertes.push({ chantier: ch, journee: j, retard: true });
        }
      });
    });

    html += '<main class="contenu">';
    html += '<div class="date-du-jour">' + U.esc(M.texteDate(today)) + '</div>';

    alertes.forEach(function (a) {
      html += '<button type="button" class="carte alerte" data-a="ouvrir-journee" data-id="' + a.journee.id + '">' +
        '<div class="ligne"><div><div class="gras">' + I('alerte', 16) + ' Point du soir à envoyer' + (a.retard ? ' (en retard)' : '') + '</div>' +
        '<div class="petit">' + U.esc(a.chantier.libelle) + ' — journée du ' + U.esc(M.texteDateCourt(a.journee.date)) + '</div></div>' +
        '<span class="chev">›</span></div></button>';
    });

    /* bouton principal : démarrer la journée */
    if (enCours.length) {
      var cible = enCours[0];
      var ouverte = A.journeeOuverteDe(cible.id);
      html += '<button type="button" class="gros-bouton" data-a="' + (ouverte ? 'ouvrir-journee' : 'demarrer-journee') + '" data-id="' + (ouverte ? ouverte.id : cible.id) + '">' +
        '<span class="rond">' + I('lecture', 18) + '</span><span>' + (ouverte ? 'REPRENDRE LA JOURNÉE' : 'DÉMARRER LA JOURNÉE') +
        '<small>' + U.esc((cible.numeroAffaire ? cible.numeroAffaire + ' · ' : '') + cible.libelle) + '</small></span></button>';
    } else {
      html += '<button type="button" class="gros-bouton" data-a="nouveau">' +
        '<span class="rond">' + I('plus', 18) + '</span><span>NOUVEAU CHANTIER<small>Aucun chantier en cours</small></span></button>';
    }

    function carteChantier(ch) {
      var av = A.avancementDe(ch);
      var js = A.journeesDe(ch.id);
      var cumul = M.cumulHommesHeures(js);
      var blocs = M.blocagesOuverts(js, today).filter(function (b) { return b.blocage.statut !== 'LEVE'; });
      var ouverte = A.journeeOuverteDe(ch.id);
      return '<button type="button" class="carte" data-a="ouvrir-chantier" data-id="' + ch.id + '">' +
        '<div class="ligne"><div class="gras">' + U.esc(ch.libelle || 'Chantier') + '</div>' + statutTag(ch.statut) + '</div>' +
        '<div class="petit">' + U.esc((ch.numeroAffaire ? ch.numeroAffaire + ' · ' : '') + (ch.client && ch.client.ville ? ch.client.ville : '')) +
          ' · J' + A.joursEcoules(ch) + '/' + (ch.dureePrevueJours || '?') + ' prévues</div>' +
        barre(av) +
        '<div class="ligne petit"><span>' + I('avancement', 15) + ' ' + av + ' %</span>' +
          '<span>' + I('effectif', 15) + ' ' + (ouverte && ouverte.effectif ? ouverte.effectif.nb : ch.effectifPrevu || 0) + ' pers. · ' + U.esc(M.texteHeuresDec(cumul)) + '</span>' +
          (blocs.length ? '<span class="rouge">' + I('interdit', 14) + ' ' + blocs.length + '</span>' : '<span class="vert">aucun blocage</span>') +
        '</div></button>';
    }

    if (enCours.length) {
      html += '<h2 class="rubrique">En cours (' + enCours.length + ')</h2>';
      enCours.forEach(function (c) { html += carteChantier(c); });
    }
    if (prevus.length) {
      html += '<h2 class="rubrique">Prévus (' + prevus.length + ')</h2>';
      prevus.forEach(function (c) { html += carteChantier(c); });
    }
    if (clotures.length) {
      html += '<h2 class="rubrique">Clôturés récemment</h2>';
      clotures.slice(0, 5).forEach(function (c) { html += carteChantier(c); });
    }
    if (!etat.chantiers.length) {
      html += vide('Aucun chantier enregistré. Créez le premier avec le bouton ci-dessus.');
    }
    html += '</main>';
    html += '<div class="barre-bas">' +
      '<button type="button" class="btn s" data-a="nouveau">' + I('plus', 16) + 'Nouveau chantier</button>' +
      '<button type="button" class="btn o" data-a="point-du-soir">' + I('pointSoir', 18) + 'Point du soir</button>' +
      '</div>';
    return html;
  }

  /* ========================= 2. NOUVEAU CHANTIER ======================= */

  function nouveauChantier() {
    var A = global.App;
    var clients = (A.etat.reglages.listes && A.etat.reglages.listes.clients) || [];
    var options = clients.map(function (c) {
      return '<option value="' + U.attr(c.nom || '') + '">' + U.esc((c.ville ? c.ville + ' — ' : '') + (c.contact || '')) + '</option>';
    }).join('');

    var html = entete('Nouveau chantier', '2 minutes avec un modèle', 'accueil');
    html += '<main class="contenu">';

    html += '<div class="carte">' +
      '<label class="champ"><span class="champ-titre">Modèle de chantier</span>' +
      '<select id="fModele" data-champ="modeleId" data-cible="nouveau">' +
      '<option value="">— aucun (chantier libre) —</option>' +
      M.MODELES.map(function (m) { return '<option value="' + m.id + '">' + U.esc(m.libelle) + '</option>'; }).join('') +
      '</select></label>' +
      '<label class="champ"><span class="champ-titre">N° d\'affaire</span>' +
      '<input id="fNumero" data-champ="numeroAffaire" data-cible="nouveau" placeholder="25-0142"></label>' +
      '<label class="champ"><span class="champ-titre">Libellé du chantier *</span>' +
      '<input id="fLibelle" data-champ="libelle" data-cible="nouveau" placeholder="Ligne 3 — installation armoire et mise en service"></label>' +
      '<label class="champ"><span class="champ-titre">Type</span><select id="fType" data-champ="type" data-cible="nouveau">' +
      M.TYPES.map(function (t) { return '<option value="' + t.id + '">' + U.esc(t.libelle) + '</option>'; }).join('') +
      '</select></label>' +
      '</div>';

    html += '<div class="carte"><h3 class="carte-titre">' + I('cible', 16) + ' Client et site</h3>' +
      '<label class="champ"><span class="champ-titre">Client *</span>' +
      '<input id="fClient" list="listeClients" data-champ="client.nom" data-cible="nouveau" placeholder="3 lettres suffisent si la liste est importée">' +
      (options ? '<datalist id="listeClients">' + options + '</datalist>' : '') + '</label>' +
      (clients.length ? '<div class="petit">Liste clients : ' + clients.length + ' entrées importées.</div>'
        : '<div class="petit">Astuce : importez votre liste clients dans Menu → Réglages pour remplir cette fiche d\'un coup.</div>') +
      '<label class="champ"><span class="champ-titre">Ville</span><input id="fVille" data-champ="client.ville" data-cible="nouveau"></label>' +
      '<label class="champ"><span class="champ-titre">Lieu d\'intervention (bâtiment, ligne, atelier)</span><input id="fSite" data-champ="client.site" data-cible="nouveau"></label>' +
      '<label class="champ"><span class="champ-titre">Référent technique sur site</span><input id="fRef" data-champ="contacts.referent" data-cible="nouveau"></label>' +
      '<div class="duo">' +
      '<label class="champ"><span class="champ-titre">Fonction</span><input id="fRefFonction" data-champ="contacts.fonction" data-cible="nouveau"></label>' +
      '<label class="champ"><span class="champ-titre">Téléphone</span><input id="fRefTel" data-champ="contacts.tel" data-cible="nouveau" inputmode="tel"></label>' +
      '</div></div>';

    html += '<div class="carte"><h3 class="carte-titre">' + I('calendrier', 16) + ' Déroulement prévu</h3>' +
      '<div class="duo">' +
      '<label class="champ"><span class="champ-titre">Effectif prévu</span><input type="number" min="1" id="fEffectif" data-champ="effectifPrevu" data-cible="nouveau" value="2"></label>' +
      '<label class="champ"><span class="champ-titre">Durée prévue (jours)</span><input type="number" min="1" id="fDuree" data-champ="dureePrevueJours" data-cible="nouveau" value="5"></label>' +
      '</div>' +
      '<div class="duo">' +
      '<label class="champ"><span class="champ-titre">Début prévu</span><input type="date" id="fDebut" data-champ="dateDebutPrevue" data-cible="nouveau" value="' + M.aujourdhui() + '"></label>' +
      '<label class="champ"><span class="champ-titre">Fin prévue</span><input type="date" id="fFin" data-champ="dateFinPrevue" data-cible="nouveau"></label>' +
      '</div>' +
      '<label class="champ"><span class="champ-titre">Équipe prévue (chef de chantier, monteurs)</span><input id="fEquipe" data-champ="equipe" data-cible="nouveau"></label>' +
      '</div>';

  /* ============================ 3. FICHE CHANTIER ====================== */

  function fiche() {

    html += '<nav class="onglets">' +

        .map(function (o) {
          return '<button type="button" class="onglet' + (onglet === o[0] ? ' actif' : '') + '" data-a="fiche-onglet" data-onglet="' + o[0] + '">' + o[1] + '</button>';

    html += '<div class="barre-bas">' +

      '</div>';
    return html;

  function ongletSynthese(ch) {
    var A = global.App;
    var today = M.aujourdhui();
    var js = A.journeesDe(ch.id);
    var av = A.avancementDe(ch);
    var ouverts = M.blocagesOuverts(js, today).filter(function (b) { return b.blocage.statut !== 'LEVE'; });
    var derniere = js.length ? js[js.length - 1] : null;

    var html = '<div class="carte">' +
      '<div class="ligne"><span class="petit">' + U.esc((ch.client && ch.client.nom ? ch.client.nom : 'Client non renseigné') +
        (ch.client && ch.client.ville ? ' — ' + ch.client.ville : '')) + '</span>' + statutTag(ch.statut) + '</div>' +
      '<div class="ligne avancement-ligne"><span class="gros-chiffre">' + av + ' %</span>' +
      '<span class="petit">avancement global' + (A.variationVeille(ch) !== null ? ' (' + (A.variationVeille(ch) > 0 ? '+' : '') + A.variationVeille(ch) + ' pts)' : '') + '</span></div>' +
      barre(av, 'barre-grande') +
      '<div class="ligne petit"><span>Journée ' + A.joursEcoules(ch) + ' / ' + (ch.dureePrevueJours || '?') + '</span>' +
      '<span>' + js.length + ' journée(s) saisie(s)</span>' +
      '<span>' + U.esc(M.texteHeuresDec(M.cumulHommesHeures(js))) + '</span></div>' +
      '</div>';

    html += '<div class="carte"><h3 class="carte-titre">' + I('avancement', 16) + ' Jalons <button type="button" class="mini-btn" data-a="editer-jalons">Modifier</button></h3>';
    (ch.jalons || []).forEach(function (j) {
      var a = Number(j.avancement) || 0;
      html += '<button type="button" class="jalon-ligne" data-a="editer-jalon" data-id="' + j.id + '">' +
        '<span class="jalon-ic">' + (a >= 100 ? I('valideCercle', 18) : (a > 0 ? I('demi', 18) : I('vide', 18))) + '</span>' +
        '<span class="jalon-lib">' + U.esc(j.libelle) + '</span>' +
        '<span class="jalon-pct">' + a + ' %</span></button>';
    });
    html += '</div>';

    if (ouverts.length) {
      html += '<div class="carte bord-rouge"><h3 class="carte-titre rouge">' + I('interdit', 16) + ' Blocages ouverts (' + ouverts.length + ')</h3>';
      ouverts.forEach(function (o) {
        html += '<div class="ligne blocage-ligne">' + graviteTag(o.blocage.gravite) +
          '<div class="blocage-texte"><div>' + U.esc(o.blocage.description) + '</div>' +
          '<div class="mini">' + U.esc(M.libelle(M.DEBLOQUEURS, o.blocage.debloqueur)) +
          (o.anciennete ? ' · ' + o.anciennete + ' jour(s)' : '') + (o.persistant ? ' · ' + I('alerte', 13) + ' persistant' : '') + '</div></div>' +
          '<button type="button" class="mini-btn" data-a="lever-blocage" data-id="' + o.journeeId + '|' + o.blocage.id + '">Lever</button>' +
          '</div>';
      });
      html += '</div>';
    }

    if (derniere && derniere.prevuDemain && (derniere.prevuDemain.taches || []).length) {
      html += '<div class="carte"><h3 class="carte-titre">' + I('calendrier', 16) + ' Prochaines étapes (prévu ' + U.esc(M.texteDateCourt(derniere.date)) + ')</h3>';
      derniere.prevuDemain.taches.forEach(function (t) { html += '<div class="petit">' + I('puce', 11) + U.esc(t) + '</div>'; });
      html += '</div>';

      html += '<div class="carte"><h3 class="carte-titre">' + I('crayon', 16) + ' Dernière synthèse (' + U.esc(M.texteDateCourt(derniere.date)) + ')</h3>' +
        '<p class="texte">' + U.esc(derniere.synthese) + '</p></div>';
    }
    return html;
  }

        '<div class="boutons-ligne">' +

        pastille('Faite', '#1c8676', '#e7f2ef') + '</div>' +

  function ongletReglagesChantier(ch) {
    var html = '<div class="carte"><h3 class="carte-titre">' + I('reglages', 16) + ' Chantier</h3>' +
      U.blocSaisie({ libelle: 'N° d\'affaire', champ: 'numeroAffaire', cible: 'chantier' }) +
